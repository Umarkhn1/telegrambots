# ── FFmpeg ────────────────────────────────────────────────
ffmpeg:
  timeout:
    seconds: 300

# ── Spotify (опционально) ─────────────────────────────────
spotify:
  client:
    id: YOUR_CLIENT_ID
    secret: YOUR_CLIENT_SECRET

# ── Shazam (опционально) ──────────────────────────────────
shazam:
  api:
    key: YOUR_SHAZAM_API_KEY

download:
  directory: downloads

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    root: INFO
    org.example.drsmedia: DEBUG
    org.hibernate: WARN
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 10

# ── Server ────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

