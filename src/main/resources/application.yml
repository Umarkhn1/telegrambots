spring:
  application:
    name: music-bot
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  datasource:
    url: jdbc:postgresql://localhost:5432/DrsMedia
    driverClassName: org.postgresql.Driver
    username: postgres
    password: root123
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

