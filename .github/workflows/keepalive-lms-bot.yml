name: keepalive lms-bot

# Бесплатный веб-сервис Render засыпает после 15 минут без входящих запросов.
# Внутри бота есть самопинг, но он спасает лишь пока процесс жив — уснувший или
# упавший сервис разбудить изнутри нельзя. Этот workflow стучится снаружи.
#
# Запуск по расписанию у GitHub неточный: под нагрузкой прогон может опоздать
# или быть пропущен. Поэтому интервал 10 минут, а каждый прогон пингует
# несколько раз с паузами — так окно без запросов почти никогда не дотягивает
# до 15 минут, даже если один прогон потерялся.
#
# Пингуем только 02:00–20:00 UTC = 07:00–01:00 по Ташкенту (UTC+5). Ночью
# сервис намеренно спит: круглосуточная работа съедает ~730 из 750 бесплатных
# часов Render в месяц, а с ночным простоем выходит ~550 и остаётся запас.
# То же окно продублировано в переменной KEEPALIVE_HOURS самого сервиса —
# иначе его внутренний самопинг будил бы себя и ночью.

on:
  schedule:
    - cron: '*/10 2-19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Пингуем сервис
        env:
          URL: https://lms-tuit-bot.onrender.com/
        run: |
          fail=0
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "$URL" || echo 000)
            echo "$(date -u +%H:%M:%S) попытка $i -> $code"
            if [ "$code" != "200" ]; then fail=$((fail+1)); fi
            if [ "$i" != "3" ]; then sleep 170; fi
          done
          if [ "$fail" = "3" ]; then
            echo "::error::сервис не ответил 200 ни разу — похоже, он лежит"
            exit 1
          fi
